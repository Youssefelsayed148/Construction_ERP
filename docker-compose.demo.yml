name: erp-demo-20261017

x-runtime: &runtime
  working_dir: /app
  image: node:20-alpine
  pull_policy: never
  volumes:
    - ./backend/src:/app/src:ro
    - ./backend/server.js:/app/server.js:ro
    - ./backend/package.json:/app/package.json:ro
    - ./backend/node_modules:/app/node_modules:ro
    - demo_uploads:/app/uploads
  networks: [demo]

x-environment: &environment
  NODE_ENV: production
  APP_ENV: staging
  PORT: "5000"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: construction_erp_demo
  DB_USER: ${DB_USER:?demo credentials required}
  DB_PASSWORD: ${DB_PASSWORD:?demo credentials required}
  JWT_SECRET: ${JWT_SECRET:?demo signing secret required}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?demo encryption key required}
  FRONTEND_URL: http://127.0.0.1:8092
  CORS_ALLOW_HTTP_LOCAL: "true"
  TRUST_PROXY: "1"
  UV_THREADPOOL_SIZE: "16"
  AUTH_RATE_LIMIT_PER_15_MIN: "1000"
  NOTIFICATION_LIVE_SEND_ENABLED: "false"
  NOTIFICATION_EMAIL_PROVIDER: "off"
  NOTIFICATION_SMS_PROVIDER: "off"
  NOTIFICATION_WHATSAPP_PROVIDER: "off"

services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: construction_erp_demo
      POSTGRES_USER: ${DB_USER:?demo credentials required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?demo credentials required}
    volumes: [demo_db:/var/lib/postgresql/data]
    networks: [demo]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d construction_erp_demo']
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *runtime
    environment:
      <<: *environment
      SEED_DEFAULT_OWNER: "true"
      DEFAULT_OWNER_EMAIL: demo-workflow_owner@demo.invalid
      DEFAULT_OWNER_PASSWORD: ${DEFAULT_OWNER_PASSWORD:?demo bootstrap secret required}
    command: [node, src/scripts/run-all-migrations.js]
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *runtime
    environment: *environment
    command: [node, server.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    image: nginx:alpine
    pull_policy: never
    ports: ["127.0.0.1:8092:80", "127.0.0.1:55442:5432"]
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/scripts/company-demo-nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [demo, ingress]
    depends_on:
      backend: {condition: service_healthy}

networks:
  demo:
    internal: true
  ingress:
volumes:
  demo_db:
  demo_uploads:
