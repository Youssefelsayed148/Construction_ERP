services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Generate .env.docker first}
      POSTGRES_USER: ${DB_USER:?Generate .env.docker first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./backend
    restart: "no"
    environment: &backend_environment
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Generate .env.docker first}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Generate .env.docker first}
      DB_USER: ${DB_USER:?Generate .env.docker first}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env.docker first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env.docker first}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      CORS_ALLOW_HTTP_LOCAL: ${CORS_ALLOW_HTTP_LOCAL:-false}
      TRUST_PROXY: "1"
      AUTH_RATE_LIMIT_PER_15_MIN: "20"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "migrate"]

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  uploads_data:
