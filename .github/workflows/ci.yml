name: ERP quality gate

on:
  push:
  pull_request:

env:
  JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
  CI: true

jobs:
  # Gate 1: fast tests on the mock DB, plus the grep guards.
  backend-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Guards (no new silent migration catches or COUNT+1 numbering)
        run: npm run lint:guards
        working-directory: backend
      - name: Backend tests (mock DB)
        run: npm test -- --runInBand --detectOpenHandles
        working-directory: backend

  # Gate 2: fresh migration and the real-PostgreSQL suite.
  backend-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp_user
          POSTGRES_PASSWORD: test-database-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U construction_erp_user -d construction_erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: construction_erp
      DB_USER: construction_erp_user
      DB_PASSWORD: test-database-password
      TEST_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Fresh database migration
        run: npm run migrate
        working-directory: backend
      - name: Migrate again (must be repeatable)
        run: npm run migrate
        working-directory: backend
      - name: Backend tests (real PostgreSQL 16)
        run: npm run test:pg
        working-directory: backend

  # Gate 3: frontend unit tests, production build, Playwright.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend unit tests
        run: npm run test:ci
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser and mobile viewport tests
        run: npm run test:e2e
        working-directory: frontend
